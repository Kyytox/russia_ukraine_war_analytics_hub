# Step 1 - Create a new work-pool
# prefect work-pool create --type process main-pool

# Step 2 - Start worker
# prefect worker start --pool main-pool

# Step 3 - Create deployment
# prefect deploy --all --prefect-file prefect.yaml

# Generic metadata about this project
name: russia_ukraine_war_analytics_hub

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
  - prefect.deployments.steps.set_working_directory:
      # directory: /app
      directory: /home/kytox/dev/russia_ukraine_war_analytics_hub

definitions:
  work_pools:
    datalake_work_pool: &datalake_work_pool
      name: main-pool
      work_queue_name: dlk-queue
      job_variables: {}
    warehouse_work_pool: &warehouse_work_pool
      name: main-pool
      work_queue_name: dwh-queue
      job_variables: {}
  schedules:
    every_minutes: &every_minutes
      cron: "* * * * *"
      timezone: "Europe/Paris"
    every_hours: &every_hours
      cron: "0 * * * *"
      timezone: "Europe/Paris"
    every_day: &every_day
      cron: "0 0 * * *"
      timezone: "Europe/Paris"
    every_2_hours: &every_2_hours
      cron: "0 */2 * * *"
      timezone: "Europe/Paris"
    every_4_hours: &every_4_hours
      cron: "0 */4 * * *"
      timezone: "Europe/Paris"

# the deployments section allows you to provide configuration for deploying flows
deployments:
  - name: dlk-flow-telegram-ingestion
    version: null
    tags: ["dlk-flow-telegram-ingestion"]
    concurrency_limit: 1
    description: "Ingestion of data from Telegram, process Extract and Clean"
    entrypoint: core.process_datalake.ingestion.flow_dlk_telegram_ingestion.flow_dlk_telegram_ingestion
    parameters: {}
    work_pool: *datalake_work_pool
    enforce_parameter_schema: true
    schedule: *every_day
    paused: True

  - name: dlk-flow-telegram-transform
    version: null
    tags: ["dlk-flow-telegram-transform"]
    concurrency_limit: 1
    description: "transform data from Telegram, process Translate"
    entrypoint: core.process_datalake.transform.flow_dlk_telegram_transform.flow_dlk_telegram_transform
    parameters: {}
    work_pool: *datalake_work_pool
    enforce_parameter_schema: true
    schedule: *every_2_hours
    paused: True

  - name: dlk-flow-qualification
    version: null
    tags: ["dlk-flow-qualification"]
    concurrency_limit: 1
    description: "Process Qualif, who regroupe 3 section, Fusion , Theming, pre_classify "
    entrypoint: core.process_datalake.qualification.flow_dlk_qualification.flow_dlk_qualification
    parameters: {}
    work_pool: *datalake_work_pool
    enforce_parameter_schema: true
    schedule: *every_2_hours
    paused: True

